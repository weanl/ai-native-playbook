<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NextAIOpsAlgoApp UI 原型</title>
  <style>
    :root {
      --bg: #f6f8fb;
      --sidebar: #ffffff;
      --surface: #ffffff;
      --soft: #f8fafc;
      --line: #d9e2ee;
      --line-soft: #edf1f7;
      --text: #1f2937;
      --muted: #667085;
      --brand: #3157d5;
      --brand-soft: #edf3ff;
      --success: #147a5c;
      --success-soft: #e8f6f0;
      --warning: #a55f12;
      --warning-soft: #fff5e6;
      --danger: #b42318;
      --danger-soft: #fff0ee;
      --shadow: 0 8px 20px rgba(31, 41, 55, 0.07);
      --radius: 10px;
      --radius-sm: 8px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }

    button, input, select, textarea { font: inherit; }
    button, select { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 3px solid rgba(49, 87, 213, 0.2);
      outline-offset: 2px;
    }

    .app {
      display: grid;
      grid-template-columns: 306px minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 18px;
      background: var(--sidebar);
      border-right: 1px solid var(--line);
      overflow-y: auto;
    }

    .brand {
      padding-bottom: 14px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--line-soft);
    }

    .brand strong {
      display: block;
      font-size: 18px;
      line-height: 25px;
    }

    .brand span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .main {
      min-width: 0;
      padding: 22px 28px 40px;
    }

    .workspace {
      max-width: 1440px;
      margin: 0 auto;
    }

    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 4px; font-size: 26px; line-height: 34px; }
    h2 { margin-bottom: 12px; font-size: 18px; line-height: 26px; }
    h3 { margin-bottom: 8px; font-size: 14px; line-height: 21px; }
    .muted, .small { color: var(--muted); }
    .small { font-size: 12px; }

    .field { display: grid; gap: 6px; margin-bottom: 13px; }
    .field label { color: var(--muted); font-size: 12px; font-weight: 720; }
    .input, .select, .textarea {
      width: 100%;
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 8px 10px;
      background: #fff;
      color: var(--text);
    }
    .textarea { min-height: 78px; resize: vertical; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 8px 12px;
      background: #fff;
      color: var(--text);
      white-space: nowrap;
    }
    .btn:hover { background: #fbfcff; border-color: #b8c3d4; }
    .btn.primary { border-color: var(--brand); background: var(--brand); color: #fff; }
    .btn.primary:hover { background: #2543a9; }
    .btn:disabled { color: #98a2b3; background: #f1f4f8; cursor: not-allowed; }

    .radio-group, .check-list, .tabs, .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .radio-group { display: grid; }

    .radio-card, .tab-button, .check-card {
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 8px 10px;
      background: #fff;
      color: var(--muted);
      text-align: left;
    }
    .radio-card.active, .tab-button.active, .check-card.active {
      border-color: #bdd0ff;
      background: var(--brand-soft);
      color: var(--brand);
      font-weight: 760;
    }

    .panel, .card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .panel { padding: 16px; }
    .card { padding: 15px; min-height: 104px; }
    .grid-2, .grid-3, .grid-4 { display: grid; gap: 14px; }
    .grid-2 { grid-template-columns: minmax(0, 0.95fr) minmax(0, 1.05fr); }
    .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .stack { display: grid; gap: 14px; }

    .metric-label { color: var(--muted); font-size: 12px; font-weight: 720; }
    .metric-value { margin: 6px 0 4px; font-size: 25px; line-height: 32px; font-weight: 800; }
    .metric-sub { color: var(--muted); font-size: 12px; }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      border: 1px solid transparent;
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 12px;
      font-weight: 720;
      white-space: nowrap;
    }
    .badge.success { border-color: #b9e5d4; background: var(--success-soft); color: var(--success); }
    .badge.warning { border-color: #ffd7a6; background: var(--warning-soft); color: var(--warning); }
    .badge.danger { border-color: #ffc7bf; background: var(--danger-soft); color: var(--danger); }
    .badge.neutral { border-color: #d8dee8; background: #f2f4f7; color: #475467; }
    .badge.brand { border-color: #bdd0ff; background: var(--brand-soft); color: var(--brand); }

    .notice {
      border: 1px solid #bdd0ff;
      border-radius: var(--radius);
      padding: 11px 12px;
      background: var(--brand-soft);
      color: #28348a;
    }
    .notice.success { border-color: #b9e5d4; background: var(--success-soft); color: #0f5b43; }
    .notice.warning { border-color: #ffd7a6; background: var(--warning-soft); color: #70430b; }
    .notice.danger { border-color: #ffc7bf; background: var(--danger-soft); color: var(--danger); }

    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    th, td {
      border-bottom: 1px solid var(--line-soft);
      padding: 10px 8px;
      text-align: left;
      vertical-align: top;
      overflow-wrap: anywhere;
    }
    th { color: var(--muted); background: #f8fafc; font-size: 12px; font-weight: 760; }
    tr:last-child td { border-bottom: 0; }
    tr.selectable { cursor: pointer; }
    tr.selectable:hover td, tr.active-row td { background: #f7f9ff; box-shadow: inset 3px 0 0 var(--brand); }

    .fake-chart {
      height: 270px;
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      background:
        linear-gradient(to right, rgba(216, 224, 236, 0.5) 1px, transparent 1px) 0 0 / 12.5% 100%,
        linear-gradient(to bottom, rgba(216, 224, 236, 0.45) 1px, transparent 1px) 0 0 / 100% 25%,
        #fbfcff;
    }
    .fake-chart svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .chart-caption {
      position: absolute;
      left: 12px;
      top: 10px;
      display: flex;
      gap: 8px;
      align-items: center;
      color: var(--muted);
      font-size: 12px;
    }

    .progress { height: 8px; border-radius: 999px; background: #e9eef6; overflow: hidden; }
    .progress > span { display: block; height: 100%; width: 0; border-radius: inherit; background: var(--brand); transition: width 180ms ease; }
    .hidden { display: none !important; }
    .divider { height: 1px; background: var(--line-soft); margin: 14px 0; }

    .toast {
      position: fixed;
      right: 22px;
      bottom: 22px;
      z-index: 30;
      display: none;
      max-width: 380px;
      border: 1px solid #bdd0ff;
      border-radius: var(--radius);
      padding: 12px 14px;
      background: var(--brand-soft);
      color: #28348a;
      box-shadow: var(--shadow);
    }
    .toast.show { display: block; }

    .drawer {
      position: fixed;
      top: 0;
      right: 0;
      z-index: 25;
      width: min(460px, 100%);
      height: 100vh;
      border-left: 1px solid var(--line);
      padding: 18px;
      background: #fff;
      box-shadow: var(--shadow);
      transform: translateX(105%);
      transition: transform 160ms ease;
      overflow-y: auto;
    }
    .drawer.open { transform: translateX(0); }
    .drawer-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; margin-bottom: 14px; }

    @media (max-width: 1040px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { position: relative; height: auto; }
      .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <strong>NextAIOpsAlgoApp</strong>
        <span>对齐 Streamlit UI 的交互原型</span>
      </div>

      <div class="field">
        <label>功能页面</label>
        <div class="radio-group" >
          <button class="radio-card active" type="button">
            <strong>指标异常检测实验</strong><br><span class="small">single / multi algorithm task</span>
          </button>
        </div>
      </div>

      <div class="divider"></div>

      <div class="notice">
        <strong>主流程</strong>
        <div class="small" style="margin-top:6px;">数据接入、数据预览、实验配置、任务管理、结果查看。</div>
      </div>
    </aside>

    <main class="main">
      <div class="workspace">
        <header style="margin-bottom: 16px;">
          <h1>指标异常检测实验</h1>
          <div class="muted">围绕指标异常检测的完整实验闭环：数据接入、预览、配置、任务管理与结果查看。</div>
        </header>

        <section class="stack" id="page-content"></section>
      </div>
    </main>
  </div>

  <aside class="drawer" id="drawer" aria-label="详情抽屉">
    <div class="drawer-head">
      <div>
        <h2 id="drawer-title">详情</h2>
        <div class="small" id="drawer-subtitle"></div>
      </div>
      <button class="btn" type="button" onclick="closeDrawer()">关闭</button>
    </div>
    <div id="drawer-body"></div>
  </aside>

  <div class="toast" id="toast"></div>

  <script>
    const dataSources = [
      { key: "csv", label: "上传 CSV", kind: "bundle", accept: ".csv", files: [
        "178_SMD_id_1_Facility_tr_6000_1st_10609.csv",
        "179_SMD_id_2_Facility_tr_5925_1st_17580.csv",
        "180_SMD_id_3_Facility_tr_5925_1st_17580.csv"
      ] },
      { key: "out", label: "上传 .out", kind: "single", accept: ".out", files: ["sample.out"] },
      { key: "npy", label: "上传 npy/npz", kind: "single", accept: ".npy,.npz", files: ["metric.npy", "label.npy"] },
      { key: "zip", label: "上传 zip", kind: "bundle", accept: ".zip", files: ["tsb-ad-u-smd-facility-subset.zip"] },
      { key: "nab_sample", label: "nab_sample", kind: "builtin", accept: "", files: ["nab_sample"] },
      { key: "yahoo_sample", label: "yahoo_sample", kind: "builtin", accept: "", files: ["yahoo_sample"] }
    ];

    const bundleFiles = [
      { name: "178_SMD_id_1_Facility_tr_6000_1st_10609.csv", rows: 24000, anomalies: 427, rate: "1.78%" },
      { name: "179_SMD_id_2_Facility_tr_5925_1st_17580.csv", rows: 23703, anomalies: 161, rate: "0.68%" },
      { name: "180_SMD_id_3_Facility_tr_5925_1st_17580.csv", rows: 23703, anomalies: 161, rate: "0.68%" }
    ];

    const algorithms = [
      { key: "three_sigma", name: "three_sigma", params: [{ name: "sigma", type: "float", value: 3.0 }], f1: 0.74, pa: 0.81, status: "completed" },
      { key: "iqr", name: "iqr", params: [{ name: "k", type: "float", value: 1.5 }], f1: 0.79, pa: 0.86, status: "completed" },
      { key: "iforest", name: "iforest", params: [{ name: "contamination", type: "enum", value: "auto" }], f1: 0.77, pa: 0.84, status: "completed" },
      { key: "lof", name: "lof", params: [{ name: "threshold_method", type: "enum", value: "percentile" }], f1: 0.62, pa: 0.70, status: "failed" }
    ];

    const state = {
      workflowTab: "ingest",
      experimentMode: "multi",
      dataSource: "csv",
      previewFile: bundleFiles[0].name,
      previewTab: "chart",
      selectedAlgo: "iqr",
      selectedBatchMetric: "pa_f1",
      selectedBatchFile: bundleFiles[0].name,
      batchTab: "leaderboard",
      selectedBatchAlgos: new Set(["three_sigma", "iqr", "iforest"]),
      batchRunning: false,
      lastSingleResult: false,
      lastBatchBundle: true
    };

    let toastTimer = 0;

    function $(selector) { return document.querySelector(selector); }
    function badge(kind, text) { return `<span class="badge ${kind}">${text}</span>`; }
    function source() { return dataSources.find((item) => item.key === state.dataSource); }
    function showToast(message) {
      const toast = $("#toast");
      toast.textContent = message;
      toast.classList.add("show");
      window.clearTimeout(toastTimer);
      toastTimer = window.setTimeout(() => toast.classList.remove("show"), 2400);
    }

    function render() {
      renderSinglePage();
    }

    function changeDataSource(value) {
      state.dataSource = value;
      state.previewFile = value === "csv" ? bundleFiles[0].name : source().files[0];
      showToast("数据源已切换，预览与实验上下文同步刷新。");
      render();
    }

    function workflowTabs() {
      return [
        { key: "ingest", label: "数据接入" },
        { key: "preview", label: "数据预览" },
        { key: "config", label: "实验配置" },
        { key: "tasks", label: "实验任务管理" },
        { key: "results", label: "实验结果查看" }
      ];
    }

    function renderWorkflowShell() {
      return `
        <div class="tabs" style="margin-bottom:14px;">
          ${workflowTabs().map((tab) => `<button class="tab-button ${state.workflowTab === tab.key ? "active" : ""}" type="button" onclick="selectWorkflowTab('${tab.key}')">${tab.label}</button>`).join("")}
        </div>
        <section class="stack" id="workflow-content"></section>
      `;
    }

    function selectWorkflowTab(key) {
      state.workflowTab = key;
      render();
    }

    function currentActiveFile() {
      const fileOptions = source().kind === "bundle" ? bundleFiles : [{ name: source().files[0], rows: 24000, anomalies: 427, rate: "1.78%" }];
      return fileOptions.find((item) => item.name === state.previewFile) || fileOptions[0];
    }

    function renderSharedDataStep() {
      const fileOptions = source().kind === "bundle" ? bundleFiles : [{ name: source().files[0], rows: 24000, anomalies: 427, rate: "1.78%" }];
      const activeFile = fileOptions.find((item) => item.name === state.previewFile) || fileOptions[0];
      return state.workflowTab === "ingest" ? renderIngestPanel(fileOptions) : renderPreviewPanel(fileOptions, activeFile);
    }

    function renderIngestPanel(fileOptions) {
      return `
        <div class="panel">
          <div class="grid-2">
            <div>
              <h2>数据上传与回显</h2>
              <div class="small">对应 _get_input_table()：单算法实验和批量实验共用同一份 upload_ok、input_table、data_source_desc、input_bundle。</div>
            </div>
            <div>
              <div class="actions" style="justify-content:flex-end;">
                ${badge("success", "upload_ok=True")}
                ${source().kind === "bundle" ? badge("brand", "input_bundle") : badge("neutral", "input_table")}
              </div>
            </div>
          </div>
          <div class="grid-2" style="margin-top:14px;">
            <div>
              <div class="field">
                <label for="shared-data-source">数据来源</label>
                <select class="select" id="shared-data-source" onchange="changeDataSource(this.value)">
                  ${dataSources.map((item) => `<option value="${item.key}">${item.label}</option>`).join("")}
                </select>
              </div>
              <div class="notice success">
                ${source().kind === "bundle"
                  ? `已加载 DatasetBundle：tsb-ad-u-smd-facility-subset，共 ${bundleFiles.length} 个文件。单算法页会走 run_bundle_experiment，批量页会走 run_batch_bundle。`
                  : `已加载单表：${source().files[0]}。单算法页会走 run_experiment，批量页会走 run_batch。`}
              </div>
            </div>
            <div>
              <h3>上传文件回显</h3>
              <table>
                <thead><tr><th>文件</th><th>处理方式</th><th>状态</th></tr></thead>
                <tbody>
                  ${fileOptions.map((file) => `<tr><td>${file.name}</td><td>${source().kind === "bundle" ? "DatasetBundle member" : "Table input"}</td><td>${badge("success", "schema ok")}</td></tr>`).join("")}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    function renderPreviewPanel(fileOptions, activeFile) {
      return `
        <div class="panel">
          <div class="grid-2">
            <div>
              <h2>共享数据预览</h2>
              <div class="small">对应 _render_data_preview(preview_table)；如果是 DatasetBundle，会先选择预览文件再展示曲线、字段质量和样例。</div>
            </div>
            <div class="field" style="margin-bottom:0;">
              <label for="preview-file">预览文件</label>
              <select class="select" id="preview-file" onchange="changePreviewFile(this.value)" ${source().kind === "bundle" ? "" : "disabled"}>
                ${fileOptions.map((file) => `<option value="${file.name}">${file.name}</option>`).join("")}
              </select>
            </div>
          </div>
          <div class="grid-4" style="margin-top:14px;">
            <div class="card"><div class="metric-label">行数</div><div class="metric-value">${activeFile.rows.toLocaleString()}</div><div class="metric-sub">profile.row_count</div></div>
            <div class="card"><div class="metric-label">列数</div><div class="metric-value">2</div><div class="metric-sub">Data / Label</div></div>
            <div class="card"><div class="metric-label">指标列</div><div class="metric-value">1</div><div class="metric-sub">Data</div></div>
            <div class="card"><div class="metric-label">真实异常点</div><div class="metric-value">${activeFile.anomalies}</div><div class="metric-sub">${activeFile.rate}</div></div>
          </div>
          <div class="tabs" style="margin-top:14px;">
            ${previewTabs().map((tab) => `<button class="tab-button ${state.previewTab === tab.key ? "active" : ""}" type="button" onclick="changePreviewTab('${tab.key}')">${tab.label}</button>`).join("")}
          </div>
          <div style="margin-top:12px;">${renderPreviewTab(activeFile)}</div>
        </div>
      `;
    }

    function syncSharedControls() {
      if ($("#shared-data-source")) $("#shared-data-source").value = state.dataSource;
      if ($("#preview-file")) $("#preview-file").value = currentActiveFile().name;
    }

    function previewTabs() {
      return [
        { key: "chart", label: "指标曲线" },
        { key: "schema", label: "字段质量" },
        { key: "sample", label: "数据样例" }
      ];
    }

    function changePreviewFile(name) {
      state.previewFile = name;
      render();
    }

    function changePreviewTab(key) {
      state.previewTab = key;
      render();
    }

    function renderPreviewTab(activeFile) {
      if (state.previewTab === "chart") {
        return `
          <div class="field" style="max-width:260px;">
            <label>预览指标</label>
            <select class="select"><option>Data</option></select>
          </div>
          <div class="fake-chart">
            <div class="chart-caption">${badge("brand", "Plotly")} Data 曲线 + Label 异常段</div>
            <svg viewBox="0 0 800 260" preserveAspectRatio="none">
              <path d="M0,150 C60,120 90,190 150,150 C210,110 260,155 310,132 C360,108 420,190 470,145 C525,92 590,130 640,118 C700,95 750,170 800,136" fill="none" stroke="#3157d5" stroke-width="3"/>
              <rect x="350" y="20" width="46" height="220" fill="rgba(180,35,24,0.12)"/>
              <rect x="690" y="20" width="82" height="220" fill="rgba(180,35,24,0.12)"/>
            </svg>
          </div>
        `;
      }
      if (state.previewTab === "schema") {
        return `
          <table>
            <thead><tr><th>列名</th><th>角色</th><th>dtype</th><th>缺失率</th><th>唯一值</th></tr></thead>
            <tbody>
              <tr><td>Data</td><td>${badge("brand", "METRIC")}</td><td>float64</td><td>0.00%</td><td>${Math.min(activeFile.rows, 23890)}</td></tr>
              <tr><td>Label</td><td>${badge("success", "LABEL")}</td><td>int64</td><td>0.00%</td><td>2</td></tr>
            </tbody>
          </table>
        `;
      }
      return `
        <table>
          <thead><tr><th>#</th><th>Data</th><th>Label</th></tr></thead>
          <tbody>
            <tr><td>1</td><td>0.567901</td><td>0</td></tr>
            <tr><td>2</td><td>0.604938</td><td>0</td></tr>
            <tr><td>3</td><td>0.604938</td><td>0</td></tr>
            <tr><td>10610</td><td>1.120370</td><td>1</td></tr>
          </tbody>
        </table>
      `;
    }

    function renderEndToEndExample() {
      if (state.experimentMode !== "multi") return "";
      return `
        <div class="panel">
          <h2>多算法完整示例</h2>
          <div class="grid-4">
            <div class="card"><div class="metric-label">1. 数据</div><div class="metric-value">Bundle</div><div class="metric-sub">TSB-AD-U SMD · 3 文件</div></div>
            <div class="card"><div class="metric-label">2. 算法</div><div class="metric-value">${state.selectedBatchAlgos.size}</div><div class="metric-sub">${[...state.selectedBatchAlgos].join(", ")}</div></div>
            <div class="card"><div class="metric-label">3. 任务</div><div class="metric-value">9 cells</div><div class="metric-sub">algorithm × input file</div></div>
            <div class="card"><div class="metric-label">4. 结果</div><div class="metric-value">8 / 9</div><div class="metric-sub">1 个失败 cell 可钻取</div></div>
          </div>
          <table style="margin-top:12px;">
            <thead><tr><th>阶段</th><th>本示例中的表现</th><th>下一步</th></tr></thead>
            <tbody>
              <tr><td>数据接入</td><td>上传 3 个 TSB-AD-U CSV，形成 DatasetBundle。</td><td>确认 schema ok。</td></tr>
              <tr><td>实验配置</td><td>选择多算法实验，算法范围为 ${[...state.selectedBatchAlgos].join(", ")}。</td><td>创建并启动任务。</td></tr>
              <tr><td>任务管理</td><td>任务 task_batch_tsb_smd_001 统一承载 9 个子任务。</td><td>查看子任务或结果。</td></tr>
              <tr><td>结果查看</td><td>总排行榜、算法×文件矩阵、文件钻取、Cell 明细。</td><td>选择候选算法。</td></tr>
            </tbody>
          </table>
        </div>
      `;
    }

    function renderSinglePage() {
      const algo = algorithms.find((item) => item.key === state.selectedAlgo) || algorithms[1];
      $("#page-content").innerHTML = `
        ${renderWorkflowShell()}
      `;
      const target = $("#workflow-content");
      if (state.workflowTab === "ingest" || state.workflowTab === "preview") {
        target.innerHTML = renderSharedDataStep() + renderEndToEndExample();
        syncSharedControls();
        return;
      }
      if (state.workflowTab === "config") {
        target.innerHTML = `
        <div class="grid-2">
          <div class="panel">
            <h2>实验配置</h2>
            <div class="field">
              <label>实验类型</label>
              <div class="tabs">
                <button class="tab-button ${state.experimentMode === "single" ? "active" : ""}" type="button" onclick="selectExperimentMode('single')">单算法实验</button>
                <button class="tab-button ${state.experimentMode === "multi" ? "active" : ""}" type="button" onclick="selectExperimentMode('multi')">多算法实验</button>
              </div>
            </div>
            <div class="field">
              <label for="single-algo">${state.experimentMode === "single" ? "选择算法" : "主算法（用于参数面板预览）"}</label>
              <select class="select" id="single-algo" onchange="selectSingleAlgo(this.value)">
                ${algorithms.map((item) => `<option value="${item.key}">${item.name}</option>`).join("")}
              </select>
            </div>
            ${state.experimentMode === "multi" ? `
              <div class="field">
                <label>批量算法范围</label>
                <div class="check-list">
                  ${algorithms.map((item) => `<button class="check-card ${state.selectedBatchAlgos.has(item.key) ? "active" : ""}" type="button" onclick="toggleBatchAlgo('${item.key}')">${item.name}</button>`).join("")}
                </div>
                <div class="small">多算法实验会创建 algorithm × input file 的任务矩阵。</div>
              </div>
            ` : ""}
            <h3>算法参数</h3>
            ${renderParamForm(algo)}
            <div class="notice" style="margin:12px 0;">实验标识：${state.experimentMode === "single" ? `${algo.name}:${algo.params.map((p) => `${p.name}=${p.value}`).join(",")}` : `batch:${[...state.selectedBatchAlgos].join(",")}`}</div>
          </div>
          <div class="panel">
            <h2>天滚动策略配置（可选）</h2>
            <div class="field">
              <label>滚动模式</label>
              <select class="select">
                <option>按天滚动：D 日训练，D+1 日推理</option>
                <option>普通单次实验：train/test split</option>
              </select>
            </div>
            <div class="field">
              <label>训练窗口</label>
              <select class="select">
                <option>累计窗口：使用 <= cutoff day 的全部数据</option>
                <option>滑动窗口：最近 3 天</option>
              </select>
            </div>
            <div class="field">
              <label>active 策略</label>
              <select class="select">
                <option>最新训练成功模型自动 active</option>
                <option>通过质量门禁后自动 active</option>
              </select>
            </div>
            <div class="grid-2">
              <div class="field">
                <label>最低 label coverage</label>
                <input class="input" type="number" value="90" min="0" max="100">
              </div>
              <div class="field">
                <label>最低 PA-F1</label>
                <input class="input" type="number" value="0.70" min="0" max="1" step="0.01">
              </div>
            </div>
            <div class="notice success">配置保持简单：先确认滚动方式、训练窗口、active 规则和两个质量门禁；更复杂的策略放到后续 M2 详情页。</div>
          </div>
        </div>`;
        target.innerHTML += `
          <div class="panel">
            <h2>创建实验任务</h2>
            <div class="grid-3">
              <div class="card"><div class="metric-label">输入</div><div class="metric-value">${source().kind === "bundle" ? "Bundle" : "Table"}</div><div class="metric-sub">${source().kind === "bundle" ? `${bundleFiles.length} 个文件` : source().files[0]}</div></div>
              <div class="card"><div class="metric-label">算法</div><div class="metric-value">${state.experimentMode === "single" ? algo.name : state.selectedBatchAlgos.size}</div><div class="metric-sub">${state.experimentMode === "single" ? "来自 REGISTRY" : "个算法，来自 REGISTRY"}</div></div>
              <div class="card"><div class="metric-label">策略</div><div class="metric-value">可选</div><div class="metric-sub">天滚动策略会随任务保存</div></div>
            </div>
            <div class="actions" style="margin-top:12px; justify-content:flex-end;">
              <button class="btn" type="button" onclick="state.workflowTab='tasks'; render();">仅创建任务</button>
              <button class="btn primary" type="button" onclick="createSingleTask(true)">创建并启动任务</button>
            </div>
          </div>
        `;
        target.innerHTML += renderEndToEndExample();
        $("#single-algo").value = state.selectedAlgo;
        return;
      }
      if (state.workflowTab === "tasks") {
        if (state.experimentMode === "multi") {
          target.innerHTML = `
            <div class="panel">
              <h2>实验任务管理</h2>
              <div class="notice">多算法实验作为一个独立实验任务展示；algorithm × input file 是该任务下的子任务矩阵。</div>
              <table style="margin-top:12px;">
                <thead><tr><th>实验任务标识</th><th>数据标识</th><th>算法标识</th><th>类型</th><th>状态</th><th>子任务</th><th>操作</th></tr></thead>
                <tbody>
                  <tr>
                    <td>task_batch_tsb_smd_001</td>
                    <td>tsb-ad-u-smd-facility-subset</td>
                    <td>${[...state.selectedBatchAlgos].join(", ")}</td>
                    <td>${badge("brand", "多算法")}</td>
                    <td>${state.lastBatchBundle ? badge("warning", "COMPLETED_WITH_FAILURES") : badge("neutral", "READY")}</td>
                    <td>${state.lastBatchBundle ? "8 / 9" : `0 / ${state.selectedBatchAlgos.size * bundleFiles.length}`}</td>
                    <td>
                      <button class="btn" type="button" onclick="openTaskDrawer('multi')">子任务</button>
                      <button class="btn" type="button" onclick="state.workflowTab='results'; render();">查看结果</button>
                      <button class="btn primary" type="button" onclick="runBatch()">启动/重跑</button>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          `;
          return;
        }
        target.innerHTML = `
          <div class="panel">
            <h2>实验任务管理</h2>
            <div class="notice">单算法任务也作为独立实验任务展示；如果输入是 DatasetBundle，子任务为 per-file run。</div>
            <table>
              <thead><tr><th>实验任务标识</th><th>数据标识</th><th>算法标识</th><th>类型</th><th>状态</th><th>子任务</th><th>操作</th></tr></thead>
              <tbody>
                <tr>
                  <td>task_single_${algo.key}_001</td>
                  <td>${source().kind === "bundle" ? "tsb-ad-u-smd-facility-subset" : state.previewFile}</td>
                  <td>${algo.name}</td>
                  <td>${badge("success", "单算法")}</td>
                  <td>${state.lastSingleResult ? badge("success", "COMPLETED") : badge("neutral", "READY")}</td>
                  <td>${source().kind === "bundle" ? (state.lastSingleResult ? `3 / ${bundleFiles.length}` : `0 / ${bundleFiles.length}`) : (state.lastSingleResult ? "1 / 1" : "0 / 1")}</td>
                  <td>
                    <button class="btn" type="button" onclick="openTaskDrawer('single')">子任务</button>
                    <button class="btn" type="button" onclick="state.workflowTab='results'; render();">查看结果</button>
                    <button class="btn primary" type="button" onclick="runSingle()">启动/重跑</button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        `;
        return;
      }
      if (state.experimentMode === "multi") {
        target.innerHTML = renderBatchResults();
        return;
      }
      target.innerHTML = `
        <div class="panel">
          <h2>实验结果查看</h2>
          ${state.lastSingleResult ? renderSingleResult(algo) : `<div class="notice">运行实验后将在这里展示检测摘要、指标解释和结果曲线。</div>`}
        </div>
      `;
    }

    function renderParamForm(algo) {
      if (!algo.params.length) {
        return `<div class="field"><label>参数 JSON</label><textarea class="textarea">{}</textarea></div>`;
      }
      return algo.params.map((param) => {
        if (param.type === "enum") {
          return `<div class="field"><label>${param.name}</label><select class="select"><option>${param.value}</option><option>zscore</option><option>percentile</option></select></div>`;
        }
        return `<div class="field"><label>${param.name}</label><input class="input" type="number" value="${param.value}"></div>`;
      }).join("");
    }

    function selectSingleAlgo(key) {
      state.selectedAlgo = key;
      render();
    }

    function selectExperimentMode(mode) {
      state.experimentMode = mode;
      render();
    }

    function runSingle() {
      state.lastSingleResult = true;
      state.workflowTab = "results";
      showToast(source().kind === "bundle" ? "DatasetBundle 单算法实验完成，已写入 per-file run。" : "单算法实验完成，run_id 已生成。");
      render();
    }

    function createSingleTask(startNow) {
      state.workflowTab = "tasks";
      if (startNow) {
        if (state.experimentMode === "single") state.lastSingleResult = true;
        else state.lastBatchBundle = true;
        showToast("实验任务已创建并启动，已跳转到任务管理。");
      } else {
        showToast("实验任务已创建，等待启动。");
      }
      render();
    }

    function renderSingleResult(algo) {
      return `
        <div class="notice success">实验完成! run_id=run_${algo.key}_178</div>
        <div class="grid-4" style="margin-top:12px;">
          <div class="card"><div class="metric-label">真实异常点</div><div class="metric-value">427</div></div>
          <div class="card"><div class="metric-label">算法检出点</div><div class="metric-value">391</div></div>
          <div class="card"><div class="metric-label">命中 TP</div><div class="metric-value">336</div></div>
          <div class="card"><div class="metric-label">误报 FP</div><div class="metric-value">${algo.key === "lof" ? 44 : 18}</div></div>
        </div>
        <table style="margin-top:12px;">
          <thead><tr><th>指标</th><th>值</th><th>含义</th></tr></thead>
          <tbody>
            <tr><td>Precision</td><td>${(algo.f1 + 0.05).toFixed(4)}</td><td>检出的异常中有多少是真的</td></tr>
            <tr><td>Recall</td><td>${(algo.f1 - 0.03).toFixed(4)}</td><td>真实异常中有多少被检出</td></tr>
            <tr><td>F1</td><td>${algo.f1.toFixed(4)}</td><td>Precision 与 Recall 的综合平衡</td></tr>
            <tr><td>PA-F1</td><td>${algo.pa.toFixed(4)}</td><td>按异常段调整后的运维友好指标</td></tr>
          </tbody>
        </table>
        <div style="margin-top:12px;" class="fake-chart">
          <div class="chart-caption">${badge("success", "iframe")} artifacts/run_${algo.key}_178/viz.html</div>
          <svg viewBox="0 0 800 260" preserveAspectRatio="none">
            <path d="M0,142 C90,95 150,188 240,124 C330,70 390,165 480,130 C570,100 640,170 800,115" fill="none" stroke="#3157d5" stroke-width="3"/>
            <circle cx="365" cy="108" r="6" fill="#b42318"/>
            <circle cx="710" cy="128" r="6" fill="#b42318"/>
          </svg>
        </div>
      `;
    }

    function toggleBatchAlgo(key) {
      if (state.selectedBatchAlgos.has(key)) state.selectedBatchAlgos.delete(key);
      else state.selectedBatchAlgos.add(key);
      render();
    }

    function runBatch() {
      state.batchRunning = true;
      render();
      window.setTimeout(() => {
        state.batchRunning = false;
        state.lastBatchBundle = true;
        state.workflowTab = "results";
        showToast(source().kind === "bundle" ? "批量数据集实验完成，summary artifact 已生成。" : "批量实验完成。");
        render();
      }, 650);
    }

    function renderBatchResults() {
      if (!state.lastBatchBundle) return `<div class="notice">已有批量实验结果会继续保留在下方。</div>`;
      const tabs = [
        ["leaderboard", "总排行榜"],
        ["matrix", "算法×文件矩阵"],
        ["drill", "文件钻取"],
        ["cells", "Cell 明细"]
      ];
      return `
        <div class="panel">
          <h2>批量数据集结果</h2>
          <div class="small">TSB-SMD-bundle · id: bb_8f32a1 · dataset: tsb-ad-u-smd-facility-subset · 状态: COMPLETED_WITH_FAILURES · summary: batch_bundle_summary.json</div>
          <div class="grid-4" style="margin-top:12px;">
            <div class="card"><div class="metric-label">算法数</div><div class="metric-value">${state.selectedBatchAlgos.size || 3}</div></div>
            <div class="card"><div class="metric-label">文件数</div><div class="metric-value">3</div></div>
            <div class="card"><div class="metric-label">成功单元</div><div class="metric-value">8</div></div>
            <div class="card"><div class="metric-label">失败单元</div><div class="metric-value">1</div></div>
          </div>
          <div class="tabs" style="margin-top:14px;">
            ${tabs.map(([key, label]) => `<button class="tab-button ${state.batchTab === key ? "active" : ""}" type="button" onclick="selectBatchTab('${key}')">${label}</button>`).join("")}
          </div>
          <div style="margin-top:12px;">${renderBatchTab()}</div>
        </div>
      `;
    }

    function selectBatchTab(key) {
      state.batchTab = key;
      render();
    }

    function renderBatchTab() {
      if (state.batchTab === "leaderboard") {
        return `
          <table>
            <thead><tr><th>algorithm</th><th>mean F1</th><th>mean PA-F1</th><th>completed</th><th>failed</th></tr></thead>
            <tbody>
              ${algorithms.slice(0, 4).map((algo) => `<tr><td>${algo.name}</td><td>${algo.f1.toFixed(4)}</td><td>${algo.pa.toFixed(4)}</td><td>${algo.key === "lof" ? 2 : 3}</td><td>${algo.key === "lof" ? 1 : 0}</td></tr>`).join("")}
            </tbody>
          </table>
        `;
      }
      if (state.batchTab === "matrix") {
        return `
          <div class="field" style="max-width:220px;"><label>矩阵指标</label><select class="select" onchange="state.selectedBatchMetric=this.value; render();"><option value="pa_f1">pa_f1</option><option value="f1">f1</option><option value="precision">precision</option><option value="recall">recall</option></select></div>
          <table>
            <thead><tr><th>file</th><th>three_sigma</th><th>iqr</th><th>iforest</th><th>lof</th></tr></thead>
            <tbody>
              ${bundleFiles.map((file, index) => `<tr><td>${file.name}</td><td>0.${81 - index}</td><td>0.${86 - index}</td><td>0.${84 - index}</td><td>${index === 2 ? badge("danger", "failed") : "0.70"}</td></tr>`).join("")}
            </tbody>
          </table>
          <div class="fake-chart" style="height:170px;margin-top:12px;"><div class="chart-caption">${badge("brand", "heatmap")} render_bundle_heatmap(metric=${state.selectedBatchMetric})</div></div>
        `;
      }
      if (state.batchTab === "drill") {
        return `
          <div class="field" style="max-width:420px;"><label>选择文件</label><select class="select" onchange="state.selectedBatchFile=this.value; render();">${bundleFiles.map((file) => `<option value="${file.name}">${file.name}</option>`).join("")}</select></div>
          <div class="fake-chart">
            <div class="chart-caption">${badge("success", "overlay")} build_file_batch_view + render_overlay：${state.selectedBatchFile}</div>
            <svg viewBox="0 0 800 260" preserveAspectRatio="none">
              <path d="M0,140 C100,100 180,175 260,128 C340,90 420,160 500,122 C590,88 680,170 800,118" fill="none" stroke="#3157d5" stroke-width="3"/>
              <path d="M0,174 C120,150 220,208 340,154 C460,120 540,190 640,152 C720,126 760,170 800,146" fill="none" stroke="#147a5c" stroke-width="2" opacity="0.8"/>
            </svg>
          </div>
        `;
      }
      return `
        <table>
          <thead><tr><th>算法</th><th>文件</th><th>状态</th><th>run_id</th><th>F1</th><th>PA-F1</th><th>错误</th></tr></thead>
          <tbody>
            ${algorithms.flatMap((algo) => bundleFiles.map((file, index) => {
              const failed = algo.key === "lof" && index === 2;
              return `<tr><td>${algo.name}</td><td>${file.name}</td><td>${failed ? badge("danger", "FAILED") : badge("success", "COMPLETED")}</td><td>${failed ? "" : `run_${algo.key}_${index + 178}`}</td><td>${failed ? "" : algo.f1.toFixed(4)}</td><td>${failed ? "" : algo.pa.toFixed(4)}</td><td>${failed ? "sample window too short" : ""}</td></tr>`;
            })).join("")}
          </tbody>
        </table>
      `;
    }

    function openDrawer(title, subtitle, body) {
      $("#drawer-title").textContent = title;
      $("#drawer-subtitle").textContent = subtitle;
      $("#drawer-body").innerHTML = body;
      $("#drawer").classList.add("open");
    }

    function openTaskDrawer(type) {
      if (type === "multi") {
        openDrawer("task_batch_tsb_smd_001", "多算法实验子任务", `
          <table>
            <thead><tr><th>子任务</th><th>算法</th><th>文件</th><th>状态</th><th>run_id / error</th></tr></thead>
            <tbody>
              ${algorithms.flatMap((candidate) => bundleFiles.map((file, index) => {
                const selected = state.selectedBatchAlgos.has(candidate.key);
                const failed = selected && candidate.key === "lof" && index === 2;
                const status = !selected ? badge("neutral", "NOT_SELECTED") : failed ? badge("danger", "FAILED") : state.lastBatchBundle ? badge("success", "COMPLETED") : badge("neutral", "READY");
                return `<tr><td>${candidate.key} × ${file.name.slice(0, 3)}</td><td>${candidate.name}</td><td>${file.name}</td><td>${status}</td><td>${failed ? "sample window too short" : selected && state.lastBatchBundle ? `run_${candidate.key}_${index + 178}` : ""}</td></tr>`;
              })).join("")}
            </tbody>
          </table>
        `);
        return;
      }
      const algo = algorithms.find((item) => item.key === state.selectedAlgo) || algorithms[1];
      openDrawer(`task_single_${algo.key}_001`, "单算法实验子任务", `
        <table>
          <thead><tr><th>子任务</th><th>输入文件</th><th>算法</th><th>状态</th><th>产物</th></tr></thead>
          <tbody>
            ${(source().kind === "bundle" ? bundleFiles : [{ name: state.previewFile }]).map((file) => `
              <tr><td>${algo.key} × ${file.name.slice(0, 3)}</td><td>${file.name}</td><td>${algo.name}</td><td>${state.lastSingleResult ? badge("success", "COMPLETED") : badge("neutral", "READY")}</td><td>viz.html / diagnostics.json</td></tr>
            `).join("")}
          </tbody>
        </table>
      `);
    }

    function closeDrawer() {
      $("#drawer").classList.remove("open");
    }

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") closeDrawer();
    });

    render();
  </script>
</body>
</html>
