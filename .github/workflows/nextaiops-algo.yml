name: NextAIOpsAlgoApp CI

on:
  push:
    paths:
      - 'next-aiops-system/nextaiops-algo-app/**'
    branches: [main, feat/pr-*]
  pull_request:
    paths:
      - 'next-aiops-system/nextaiops-algo-app/**'
    branches: [main]

jobs:
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: next-aiops-system/nextaiops-algo-app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv pip install --system ruff mypy

      - name: Run ruff lint
        run: |
          if [ -d "src" ]; then ruff check src/; fi
          if [ -d "tests" ]; then ruff check tests/; fi

      - name: Run mypy
        run: if [ -d "src" ]; then mypy --strict src/; fi

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: next-aiops-system/nextaiops-algo-app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv pip install --system pytest

      - name: Run tests
        run: |
          if [ -d "tests" ]; then
            set +e  # Temporarily disable errexit
            pytest tests/ -v
            exit_code=$?
            set -e  # Re-enable errexit
            # exit code 5 = no tests collected (acceptable for placeholder stage)
            if [ $exit_code -ne 0 ] && [ $exit_code -ne 5 ]; then
              exit $exit_code
            fi
          fi